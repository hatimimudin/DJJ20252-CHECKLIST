  <style>
    body { box-sizing: border-box; }
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    * { font-family: 'Inter', sans-serif; }
    
    .workshop-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border-left: 4px solid transparent; }
    .workshop-card:hover { transform: translateY(-2px); box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.15); }
    .workshop-card.active { border-left-color: currentColor; }
    .checklist-item { transition: background-color 0.2s ease; }
    .checklist-item:hover { background-color: rgba(0, 0, 0, 0.02); }
    
    .checkbox-custom {
      appearance: none; width: 22px; height: 22px; border: 2px solid #cbd5e1;
      border-radius: 6px; cursor: pointer; position: relative; transition: all 0.2s ease; flex-shrink: 0;
    }
    .checkbox-custom:hover { border-color: #94a3b8; }
    .checkbox-custom:checked { background-color: #10b981; border-color: #10b981; }
    .checkbox-custom:checked::after {
      content: '✓'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: white; font-size: 14px; font-weight: bold;
    }
    
    .phase-badge {
      display: inline-flex; align-items: center; padding: 6px 14px; border-radius: 20px;
      font-size: 13px; font-weight: 600; letter-spacing: 0.3px;
    }
    .progress-ring { transform: rotate(-90deg); }
    .progress-ring-circle { transition: stroke-dashoffset 0.5s ease; }
    .fade-in { animation: fadeIn 0.4s ease-in; }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    /* =========================================
       CSS KHAS UNTUK CETAKAN PDF YANG KEMAS
       ========================================= */
    @media print {
      * { 
        -webkit-print-color-adjust: exact !important; 
        print-color-adjust: exact !important; 
        color-adjust: exact !important; 
      }
      body { background: white !important; color: black !important; }
      #app, .min-h-full, .overflow-auto, .overflow-x-auto, .overflow-y-auto { 
        background: white !important; 
        overflow: visible !important; 
        max-height: none !important;
        height: auto !important;
      }
      
      /* Jadikan Teks Header Hitam untuk PDF */
      #course-title, #subtitle, .jkm-title { color: #000 !important; }
      
      /* Sembunyikan elemen UI yang tak diperlukan dalam PDF */
      .no-print, button[onclick*="toggleGuide"], button[onclick*="toggleTips"], .guide-content, .tips-content { display: none !important; }
      #app > div > div > div:nth-child(3), .workshop-card { display: none !important; }
      label[for="project-images"], input#project-images, input[type="file"] { display: none !important; }
      
      /* Kawalan Ruang Muka Surat (Pagination) */
      .print-page-break {
        page-break-before: always !important;
        break-before: page !important;
        border-top: none !important;
        padding-top: 0 !important;
        margin-top: 0 !important;
      }
      .page-break-inside-avoid { 
        page-break-inside: avoid !important; 
        break-inside: avoid !important; 
      }
      
      /* Kawalan Textarea Tanpa Scrollbar */
      textarea {
        overflow: visible !important;
        resize: none !important;
        height: auto !important;
        min-height: 40px !important;
        border: 1px solid #777 !important;
        background: transparent !important;
        white-space: pre-wrap !important;
      }

      /* Gambar Preview Final Product */
      #image-preview-container { display: block !important; visibility: visible !important; page-break-inside: avoid !important; margin-bottom: 20px !important; }
      #image-section-title { display: block !important; font-size: 18px !important; font-weight: bold !important; color: #000 !important; margin: 10px 0 !15px 0 !important; border-bottom: 2px solid #000 !important; padding-bottom: 5px !important; }
      #image-preview { display: grid !important; grid-template-columns: repeat(2, 1fr) !important; gap: 15px !important; margin: 15px 0 !important; }
      #image-preview .image-item { display: block !important; visibility: visible !important; page-break-inside: avoid !important; break-inside: avoid !important; margin-bottom: 15px !important; }
      #image-preview .image-item img { display: block !important; visibility: visible !important; width: 100% !important; max-width: 100% !important; height: auto !important; max-height: 250px !important; object-fit: contain !important; border: 2px solid #333 !important; border-radius: 4px !important; background: white !important; padding: 4px !important; margin: 0 auto 10px auto !important; }
      
      /* Jadual Assessment */
      #assessment-forms { display: block !important; visibility: visible !important; margin-top: 25px !important; }
      #assessment-forms > div { display: block !important; visibility: visible !important; background: white !important; border: 2px solid #333 !important; padding: 15px !important; margin-bottom: 20px !important; }
      #assessment-forms h4, #assessment-forms h5 { display: block !important; font-weight: bold !important; color: #000 !important; margin-bottom: 10px !important; }
      #assessment-forms table { display: table !important; width: 100% !important; border-collapse: collapse !important; }
      #assessment-forms th, #assessment-forms td { display: table-cell !important; border: 1px solid #000 !important; padding: 8px !important; font-size: 11px !important; color: #000 !important; }
      #assessment-forms th { background: #e5e7eb !important; font-weight: bold !important; }
      
      input[type="text"] { border: 1px solid #777 !important; background: transparent !important; color: #000 !important; }
      input[type="checkbox"] { border: 2px solid #333 !important; }
      input[type="checkbox"]:checked { background: #10b981 !important; }
      input[type="checkbox"]:checked::after { content: '✓' !important; }
      
      /* Senarai Semak & Maklumat Global */
      #checklist-container { box-shadow: none !important; max-width: 100% !important; margin: 0 !important; display: block !important; border: none !important; }
      #checklist-header { background: white !important; color: black !important; border-bottom: 3px solid #333 !important; padding: 10px 20px 20px 20px !important; }
      #checklist-header h2, #checklist-header p, #checklist-header label, #checklist-header input { color: black !important; }
      
      #student-info-global { display: block !important; page-break-after: avoid !important; margin-bottom: 20px !important; border: 2px solid #333 !important; background: white !important; box-shadow: none !important; }
      #student-info-global h3, #student-info-global label, #student-info-global input { color: black !important; }
      
      .checklist-item { page-break-inside: avoid; border: 1px solid #333 !important; }
      .defect-card { border: 2px solid #333 !important; background: white !important; margin-bottom: 15px !important; }
      
      @page { margin: 1.2cm; size: A4; }
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>

  <script>
    const defaultConfig = {
      course_title: "DJJ20252 Mechanical Workshop Practice 2",
      subtitle: "Digital Checklist & Report System",
      background_color: "#667eea",
      card_color: "#ffffff",
      text_color: "#1f2937",
      primary_action_color: "#764ba2",
      secondary_action_color: "#10b981"
    };

    let defectCounter = 0; // Mengira bilangan kotak kecacatan

    const assessmentForms = {
      lathe: {
        title: "MACHINING: RESULTS",
        measurements: [
          { process: "Facing and parallel turning", item: "Length, L15", dimension: 15, tolerance: "±0.5mm" },

      },
      welding: {
        title: "WELDING: RESULTS",
        sections: [
          {
            name: "T JOINT",
            defects: [
              { defect: "Undercut", description: "A groove along the weld toe, weakening the joint." },
              { defect: "Lack of Fusion", description: "Weld metal does not properly fuse with the base metal." },
              { defect: "Excessive Spatter", description: "Small metal droplets around the weld bead." },
              { defect: "Weld Bead Irregularity", description: "Uneven bead width or inconsistent penetration." },
              { defect: "Burn-Through", description: "Excessive heat melts through the base metal." }
            ]
          },
          {
            name: "LAP JOINT",
            defects: [
              { defect: "Undercut", description: "A groove along the weld toe, weakening the joint." },
              { defect: "Lack of Fusion", description: "Weld metal does not properly fuse with the base metal." },
              { defect: "Excessive Spatter", description: "Small metal droplets around the weld bead." },
              { defect: "Weld Bead Irregularity", description: "Uneven bead width or inconsistent penetration." },
              { defect: "Burn-Through", description: "Excessive heat melts through the base metal." }
            ]
          }
        ]
      }
    };

    const workshops = {
      foundry: {
        name: "Foundry Workshop",
        color: "#ef4444",
        phases: [
          {
            name: "Persediaan",
            items: [
              { task: "Memakai PPE lengkap: Apron kalis panas, Face Shield, Safety Boot, dan sarung tangan kulit.", criteria: "CLO 01P: Safety" },
              { task: "Menyediakan pola (pattern) dengan mengambil kira faktor pengecutan logam.", criteria: "CLO 02P: Teknikal", guide: "Rujuk modul untuk jenis-jenis pattern." },
              { task: "Memastikan pasir acuan mempunyai kelembapan yang betul untuk proses Molding.", criteria: "CLO 02P: SOP", guide: "Kelembapan optimum: 6-8% untuk pasir hijau (green sand)." }
            ]
          },
          {
            name: "Proses",
            items: [
              { task: "Memadatkan pasir dalam drag dan cope secara sekata bagi mengelakkan runtuhan.", criteria: "CLO 02P: Proficiency", guide: "Gunakan rammer dengan 3-4 hentakan per kawasan." },
              { task: "Melakukan penuangan (casting) secara stabil dan berterusan untuk mengelakkan Cold Shut.", criteria: "CLO 02P: Teknikal", guide: "Suhu penuangan optimum Aluminium: 700-750°C." }

          },
          {
            name: "Pemeriksaan",
            items: [
              { task: "Memeriksa permukaan produk bagi mengesan kecacatan Blowholes atau Inclusions.", criteria: "Product Accuracy", guide: "Semak kehadiran liang gas atau sanga." },
              { task: "Memastikan tiada kecacatan Misruns (acuan tidak penuh) pada hasil tuangan.", criteria: "Finishing Quality", guide: "Bentuk mesti terbentuk secara seragam." }
            ]
          },
          {
            name: "Penutup",
            items: [
              { task: "Membersihkan kawasan kerja dan menyimpan semula peralatan rammer serta flask.", criteria: "Work Area Safety" }
            ]
          }
        ]
      },
      lathe: {
        name: "Lathe Machining Workshop",
        color: "#3b82f6",
        phases: [
          {
            name: "Persediaan",
            items: [
              { task: "Memakai PPE lengkap (Kasut keselamatan, baju bengkel, pelindung mata).", criteria: "CLO 01P: Safety" },
              { task: "Melakukan pemeriksaan visual pada mesin dan memastikan suis kecemasan berfungsi.", criteria: "CLO 01P: Safety" },
              { task: "Memasang mata alat (tool bit) pada ketinggian pusat (center height) yang tepat.", criteria: "CLO 02P: Proficiency" }
            ]
          },
          {
            name: "Proses",
            items: [
              { task: "Melakukan Facing untuk mendapatkan permukaan rujukan yang rata.", criteria: "CLO 02P: SOP" },
              { task: "Menetapkan bacaan \"0\" pada dial sebelum memulakan pemotongan Parallel Turning.", criteria: "CLO 02P: SOP" },
              { task: "Memastikan kelajuan pusingan (RPM) mesin sesuai dengan jenis bahan.", criteria: "CLO 02P: Handling" },
              { task: "Melakukan Parallel Turning untuk menghasilkan diameter yang seragam.", criteria: "CLO 02P: Proficiency" },
              { task: "Melakukan Grooving dengan ketepatan untuk menghasilkan alur.", criteria: "CLO 02P: Proficiency" },

              { task: "Melakukan Threading untuk menghasilkan benang M35x2.5.", criteria: "CLO 02P: Proficiency" }

          {
            name: "Pemeriksaan",
            items: [
              { task: "Mengukur panjang L15 (Grooving) berada dalam toleransi ±0.5mm.", criteria: "Product Accuracy" },

              { task: "Memeriksa Threading d35 (M35x2.5).", criteria: "Product Accuracy" }

          {
            name: "Penutup",

        ]
      },
      welding: {
        name: "TIG/MIG Welding Workshop",
        color: "#f59e0b",
        phases: [
          {
            name: "Persediaan",
            items: [
              { task: "Memakai PPE lengkap: Welding Helmet, Apron, sarung tangan kulit, dan Safety Boot.", criteria: "CLO 01P: Safety" },
              { task: "Memastikan sistem pengudaraan berfungsi dan menetapkan arus (Amperage).", criteria: "Tool Handling" },
              { task: "Membersihkan permukaan logam rujukan (T-Joint/Lap Joint) daripada karat.", criteria: "CLO 02P: SOP" }
            ]
          },
          {
            name: "Proses",
            items: [
              { task: "Mengekalkan sudut obor dan kelajuan yang konsisten bagi mengelakkan Undercut.", criteria: "CLO 02P: Proficiency" },
              { task: "Mengawal kawah kimpalan untuk mengelakkan kecacatan Burn-Through atau Excessive Spatter.", criteria: "CLO 02P: Teknikal" }
            ]
          },
          {
            name: "Pemeriksaan",
            items: [
              { task: "Memeriksa rupa bentuk Weld Bead agar seragam dan tiada rupa bentuk tidak sekata.", criteria: "Product Accuracy" },
              { task: "Memastikan tiada kecacatan Lack of Fusion pada sambungan kimpalan.", criteria: "Finishing Quality" }
            ]
          },
          {
            name: "Penutup",
            items: [
              { task: "Menutup bekalan gas/elektrik dan membersihkan tatal kimpalan di meja kerja.", criteria: "Work Area Health" }
            ]
          }
        ]
      }
    };

    let checklistData = [];
    let currentWorkshop = null;
    let uploadedImages = [];
    let lecturerNameCache = {};

    const dataHandler = {
      onDataChanged(data) {
        checklistData = data;
        updateAllProgress();
        if (currentWorkshop) {
          renderChecklist(currentWorkshop);
        }
      }
    };

    async function initApp() {
      if (window.dataSdk) {
        const initResult = await window.dataSdk.init(dataHandler);
        if (!initResult.isOk) {
          console.error("Failed to initialize data SDK");
        }
      }
    }

    function isChecked(workshopType, phase, itemIndex) {
      return checklistData.some(item => 
        item.workshop_type === workshopType && 
        item.phase === phase && 
        item.item_index === itemIndex && 
        item.checked
      );
    }

    async function toggleCheckbox(workshopType, phase, itemIndex, checked) {
      const checkbox = event.target;
      checkbox.disabled = true;
      
      const existingItem = checklistData.find(item => 
        item.workshop_type === workshopType && 
        item.phase === phase && 
        item.item_index === itemIndex
      );

      if (existingItem) {
        existingItem.checked = checked;
        existingItem.timestamp = new Date().toISOString();
        
        updateAllProgress();
        if(window.dataSdk) {
          const updateResult = await window.dataSdk.update(existingItem);
          if (!updateResult.isOk) {
            existingItem.checked = !checked;
            checkbox.checked = !checked;
            updateAllProgress();
          }
        }
      } else {
        if (checklistData.length >= 999) {
          showMessage("Limit maksimum 999 item telah dicapai.");
          checkbox.checked = !checked;
          checkbox.disabled = false;
          return;
        }
        
        const newItem = {
          workshop_type: workshopType,
          phase: phase,
          item_index: itemIndex,
          checked: checked,
          timestamp: new Date().toISOString()
        };
        
        checklistData.push(newItem);
        updateAllProgress();
        
        if(window.dataSdk) {
          const createResult = await window.dataSdk.create(newItem);
          if (!createResult.isOk) {
            checklistData.pop();
            checkbox.checked = !checked;
            updateAllProgress();
          }
        }
      }
      checkbox.disabled = false;
    }

    function updateAllProgress() {
      Object.keys(workshops).forEach(key => {
        const workshop = workshops[key];
        const totalItems = workshop.phases.reduce((sum, phase) => sum + phase.items.length, 0);
        const checkedItems = workshop.phases.reduce((sum, phase) => {
          return sum + phase.items.filter((_, idx) => isChecked(key, phase.name, idx)).length;
        }, 0);
        
        const percentage = totalItems > 0 ? (checkedItems / totalItems) * 100 : 0;
        const circumference = 163.36;
        const offset = circumference - (percentage / 100) * circumference;
        
        const progressCircle = document.getElementById(`progress-${key}`);
        if (progressCircle) {
          progressCircle.style.strokeDashoffset = offset;
        }
        
        const countElement = document.getElementById(`${key}-count`);
        if (countElement) {
          countElement.textContent = `${checkedItems}/${totalItems}`;
        }
      });
    }

    function handleImageUpload(event) {
      const files = event.target.files;
      const preview = document.getElementById('image-preview');
      const sectionTitle = document.getElementById('image-section-title');
      preview.innerHTML = '';
      uploadedImages = [];
      
      if (files.length > 5) {
        showMessage('⚠️ Maksimum 5 gambar sahaja. Hanya 5 gambar pertama akan dimuat naik.');
      }
      
      const maxFiles = Math.min(files.length, 5);
      
      if (maxFiles > 0) {
        sectionTitle.style.display = 'block';
      } else {
        sectionTitle.style.display = 'none';
      }
      
      for (let i = 0; i < maxFiles; i++) {
        const file = files[i];
        const reader = new FileReader();
        
        reader.onload = function(e) {
          const base64Image = e.target.result;
          uploadedImages.push({ filename: file.name, data: base64Image });
          
          const imgContainer = document.createElement('div');
          imgContainer.className = 'relative group image-item page-break-inside-avoid';
          
          const img = document.createElement('img');
          img.src = base64Image;
          img.loading = 'lazy';
          img.className = 'project-image';
          img.style.cssText = 'width: 100%; height: auto; max-height: 250px; object-fit: contain; border: 2px solid #e2e8f0; border-radius: 8px;';
          
          const button = document.createElement('button');
          button.onclick = function() { removeImage(i); };
          button.className = 'no-print absolute top-2 right-2 bg-red-500 text-white w-8 h-8 rounded-full opacity-0 group-hover:opacity-100 transition-opacity font-bold text-sm';
          button.textContent = '✕';
          
          imgContainer.appendChild(img);
          imgContainer.appendChild(button);
          preview.appendChild(imgContainer);
        };
        
        reader.readAsDataURL(file);
      }
    }

      const sectionTitle = document.getElementById('image-section-title');

    function adjustColor(color, percent) {
      const num = parseInt(color.replace("#", ""), 16);
      const amt = Math.round(2.55 * percent);
      const R = (num >> 16) + amt;
      const G = (num >> 8 & 0x00FF) + amt;
      const B = (num & 0x0000FF) + amt;
      return "#" + (0x1000000 + (R < 255 ? R < 1 ? 0 : R : 255) * 0x10000 +
        (G < 255 ? G < 1 ? 0 : G : 255) * 0x100 +
        (B < 255 ? B < 1 ? 0 : B : 255))
        .toString(16).slice(1);
    }

    function toggleGuide(button) {
      const guideContent = button.nextElementSibling;
      const icon = button.querySelector('.toggle-icon');
      
      if (guideContent.classList.contains('hidden')) {
        guideContent.classList.remove('hidden');
        guideContent.classList.add('fade-in');
        icon.textContent = '▲';
        button.querySelector('span:first-child').textContent = '📋 Tutup Panduan';
      } else {
        guideContent.classList.add('hidden');
        icon.textContent = '▼';
        button.querySelector('span:first-child').textContent = '📋 Lihat Panduan';
      }
    }

    function toggleTips(button) {
      const tipsContent = button.nextElementSibling;
      const icon = button.querySelector('.toggle-icon');
      
      if (tipsContent.classList.contains('hidden')) {
        tipsContent.classList.remove('hidden');
        tipsContent.classList.add('fade-in');
        icon.textContent = '▲';
        button.querySelector('span:first-child').textContent = '💡 Tutup Tips';
      } else {
        tipsContent.classList.add('hidden');
        icon.textContent = '▼';
        button.querySelector('span:first-child').textContent = '💡 Lihat Tips';
      }
    }

    async function onConfigChange(config) {
      const courseTitle = config.course_title || defaultConfig.course_title;
      const subtitle = config.subtitle || defaultConfig.subtitle;
      const backgroundColor = config.background_color || defaultConfig.background_color;
      
      document.getElementById('course-title').textContent = courseTitle;
      document.getElementById('subtitle').textContent = subtitle;
      
      const mainBg = document.querySelector('.min-h-full');
      if (mainBg) {
        mainBg.style.background = `linear-gradient(135deg, ${backgroundColor} 0%, ${config.primary_action_color || defaultConfig.primary_action_color} 100%)`;
      }
    }

    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities: (config) => ({
          recolorables: [
            { get: () => config.background_color || defaultConfig.background_color, set: (value) => { config.background_color = value; window.elementSdk.setConfig({ background_color: value }); } },
            { get: () => config.card_color || defaultConfig.card_color, set: (value) => { config.card_color = value; window.elementSdk.setConfig({ card_color: value }); } },
            { get: () => config.text_color || defaultConfig.text_color, set: (value) => { config.text_color = value; window.elementSdk.setConfig({ text_color: value }); } },
            { get: () => config.primary_action_color || defaultConfig.primary_action_color, set: (value) => { config.primary_action_color = value; window.elementSdk.setConfig({ primary_action_color: value }); } },
            { get: () => config.secondary_action_color || defaultConfig.secondary_action_color, set: (value) => { config.secondary_action_color = value; window.elementSdk.setConfig({ secondary_action_color: value }); } }
          ],
          borderables: [],
          fontEditable: undefined,
          fontSizeable: undefined
        }),
        mapToEditPanelValues: (config) => new Map([
          ["course_title", config.course_title || defaultConfig.course_title],
          ["subtitle", config.subtitle || defaultConfig.subtitle]
        ])
      });
    }

    initApp();
  </script>
 </body>
</html>
